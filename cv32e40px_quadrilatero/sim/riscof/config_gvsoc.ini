# RISCOF configuration qualifying GVSOC as a CV32E40P reference model:
# GVSOC is the DUT, the Sail C emulator is the golden reference.
#
# Site-specific paths (gvrun, env_bin, PATH, sail_config) need adjusting for
# each checkout. Before the first run:
#
#   1. Build the Sail configuration once:
#        sail_cSim/gen_sail_config.py <sail_riscv_sim> <sail_config path below>
#   2. Put sail_riscv_sim on PATH, or set PATH= under [sail_cSim].
#   3. Make sure riscv32-unknown-elf-* resolve; on a toolchain that only ships
#      riscv64-unknown-elf-*, symlinks are enough (both target rv32 here).

[RISCOF]
ReferencePlugin=sail_cSim
ReferencePluginPath=./sail_cSim
DUTPlugin=gvsoc
DUTPluginPath=./gvsoc

[gvsoc]
pluginpath=./gvsoc
ispec=./gvsoc/gvsoc_isa.yaml
pspec=./gvsoc/gvsoc_platform.yaml
target_run=1
jobs=8
sw_toolchain_prefix=unknown
# GVSOC target. The -fpu variant is rv32imfc; use cv32e40p-v2-standalone for
# rv32imc without the F extension.
target=cv32e40p-v2-standalone-fpu
gvrun=/data/marco.paci/projects/core-v-verif/vendor_lib/gvsoc_rvvi/install/bin/gvrun
# gvrun resolves python3 from PATH and needs the GVSOC environment.
env_bin=/home/marco.paci/.local/share/mamba/envs/gvsoc_env_3_12/bin
# Per-test wall clock cap, seconds. Tests that terminate do so in ~1-2s, so
# anything near this cap is a hang, not a slow test.
sim_timeout=120

[sail_cSim]
pluginpath=./sail_cSim
target_run=1
jobs=8
make=make
sw_toolchain_prefix=unknown
PATH=/data2/marco.paci/riscof/sail/sail-riscv-Linux-x86_64/bin
sail_config=/data2/marco.paci/riscof/sail_cv32e40p_rv32imfc.json
