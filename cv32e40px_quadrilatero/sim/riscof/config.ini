[RISCOF]
ReferencePlugin=sail_cSim
ReferencePluginPath=./sail_cSim
DUTPlugin=cv32e40p
DUTPluginPath=./cv32e40p

[cv32e40p]
pluginpath=./cv32e40p
ispec=./cv32e40p/cv32e40p_isa.yaml
pspec=./cv32e40p/cv32e40p_platform.yaml
target_run=1
jobs=6
PATH=riscof
corevverifPATH=../../../
imperas_iss=no
dut_cfg=default
sw_toolchain_prefix=unknown
enable_sim_cov=yes

[sail_cSim]
pluginpath=./sail_cSim
#docker=True
image=registry.gitlab.com/incoresemi/docker-images/compliance
target_run=1
jobs=1
#PATH=/usr/bin/
make=make
sw_toolchain_prefix=unknown
# Mandatory since sail-riscv 0.9: the emulator reads XLEN and the enabled
# extensions from this file rather than from the binary name. Generate it with
#   sail_cSim/gen_sail_config.py $(which sail_riscv_sim) <path below>
sail_config=./sail_cSim/sail_cv32e40p.json

